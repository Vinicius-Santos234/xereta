<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xereta</title>
<link rel="stylesheet" href="ilha.css">
</head>
<body>
  <div class="ilha" id="ilha">
    <div class="recolhida">
      <canvas id="gato-pilula"></canvas>
      <span id="texto-pilula"></span>
    </div>
    <div class="aberta">
      <canvas id="gato-ilha"></canvas>
      <div class="info">
        <div class="linha1">
          <span class="cabeca"><b id="titulo"></b><span id="subtitulo"></span></span>
          <span class="contagem" id="contagem"></span>
        </div>
        <div class="linha2" id="fala"></div>
        <div class="linha3" id="dica"></div>
        <!-- o cartão da sessão (classe .contando na ilha): os dois últimos passos -->
        <div class="passos">
          <div class="passo" id="passo-anterior"><span class="marca"></span><span class="texto"></span><span class="conta"><span class="mais"></span> <span class="menos"></span></span></div>
          <div class="passo atual" id="passo-atual"><span class="marca"></span><span class="texto"></span><span class="conta"><span class="mais"></span> <span class="menos"></span></span></div>
        </div>
        <!-- o cartão do fim (classe .terminou na ilha): a mensagem final e o OK -->
        <div class="final">
          <div class="mensagem" id="mensagem"></div>
          <button type="button" id="bt-ok"></button>
        </div>
        <!-- só durante um pedido de permissão (classe .pedindo na ilha) -->
        <div class="alvo" id="alvo"></div>
        <div class="acoes">
          <button type="button" data-decisao="negar" id="bt-negar"></button>
          <button type="button" data-decisao="permitir" id="bt-permitir" class="principal"></button>
          <button type="button" data-decisao="terminal" id="bt-terminal" class="discreto"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="textos/pt-BR.js"></script>
  <script src="mascote/gato.js"></script>
  <script src="adaptadores/claude-code.js"></script>
  <script src="ponte.js"></script>
  <script src="ilha.js"></script>
</body>
</html>
